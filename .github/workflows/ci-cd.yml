name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  # ==================================================
  # AWS / S3
  # ==================================================

  AWS_REGION: ap-south-1
  S3_BUCKET: adx6sh-portfolio

  # ==================================================
  # Docker / EC2
  # ==================================================

  IMAGE_NAME: adx6sh/adx6sh-portfolio-repository
  CONTAINER_NAME: adx6sh-portfolio
  APP_PORT: 3000

jobs:
  # ==================================================
  # CONTINUOUS INTEGRATION
  # ==================================================

  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # Checkout
      # ------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------
      # Node.js
      # ------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ------------------------------------------
      # Install dependencies
      # ------------------------------------------

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------
      # Lint
      # ------------------------------------------

      - name: Run lint
        run: npm run lint

      # ------------------------------------------
      # Tests
      # ------------------------------------------

      - name: Run tests
        run: npm test --if-present

      # ------------------------------------------
      # Build Next.js application
      # ------------------------------------------

      - name: Build application
        run: npm run build

      # ------------------------------------------
      # Verify Next.js static export
      # ------------------------------------------

      - name: Verify static export
        run: |
          set -e

          if [ ! -d "out" ]; then
            echo "ERROR: out/ directory was not generated."
            echo "Make sure next.config.ts/js contains:"
            echo "output: 'export'"
            exit 1
          fi

          echo "=========================================="
          echo "Static export generated successfully"
          echo "=========================================="

          echo "Build size:"
          du -sh out/

          echo "Generated files:"
          find out -maxdepth 2 -type f | head -50

      # ------------------------------------------
      # Upload static build
      # ------------------------------------------

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-static-build
          path: out/
          if-no-files-found: error
          retention-days: 1

  # ==================================================
  # S3 DEPLOYMENT
  # ==================================================

  deploy-s3:
    name: Deploy to Amazon S3
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    steps:
      # ------------------------------------------
      # Download build artifact
      # ------------------------------------------

      - name: Download Next.js build
        uses: actions/download-artifact@v4
        with:
          name: nextjs-static-build
          path: out/

      # ------------------------------------------
      # Verify artifact
      # ------------------------------------------

      - name: Verify build artifact
        run: |
          set -e

          if [ ! -d "out" ]; then
            echo "ERROR: out/ directory does not exist."
            exit 1
          fi

          echo "Build artifact verified."
          du -sh out/

      # ------------------------------------------
      # Debug GitHub OIDC claims
      # ------------------------------------------

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -e

          TOKEN=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            jq -r '.value')

          python3 - "$TOKEN" <<'PY'
          import sys
          import base64
          import json

          token = sys.argv[1]

          # Decode JWT payload only.
          # The actual token is NOT printed.
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("==========================================")
          print("GitHub OIDC Claims")
          print("==========================================")

          for key in [
              "iss",
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "environment"
          ]:
              print(f"{key}: {claims.get(key)}")

          print("==========================================")
          PY

      # ------------------------------------------
      # Configure AWS OIDC
      # ------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # ------------------------------------------
      # Verify AWS identity
      # ------------------------------------------

      - name: Verify AWS credentials
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      # ------------------------------------------
      # Deploy to S3
      # ------------------------------------------

      - name: Deploy website to S3
        run: |
          set -e

          echo "=========================================="
          echo "Starting S3 deployment"
          echo "=========================================="

          echo "Bucket: s3://${S3_BUCKET}"

          aws s3 sync out/ \
            "s3://${S3_BUCKET}" \
            --delete

      # ------------------------------------------
      # Verify S3 deployment
      # ------------------------------------------

      - name: Verify S3 deployment
        run: |
          echo "=========================================="
          echo "S3 DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo "Bucket:"
          echo "s3://${S3_BUCKET}"

          echo ""

          echo "Sample objects:"

          aws s3 ls \
            "s3://${S3_BUCKET}" \
            --recursive | head -30

  # ==================================================
  # BUILD AND PUSH DOCKER IMAGE
  # ==================================================

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      # ------------------------------------------
      # Checkout
      # ------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup Docker Buildx
      # ------------------------------------------

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------
      # Login to Docker Hub
      # ------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------
      # Generate immutable image tag
      # ------------------------------------------

      - name: Generate Docker image tag
        id: meta
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Docker image"
          echo "=========================================="

          echo "${IMAGE_NAME}:${IMAGE_TAG}"

      # ------------------------------------------
      # Build and push image
      # ------------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: true
          sbom: true

  # ==================================================
  # EC2 DEPLOYMENT
  # ==================================================

  deploy-ec2:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      # ------------------------------------------
      # Deploy to EC2
      # ------------------------------------------

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2

        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.docker.outputs.image_tag }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_NAME,IMAGE_TAG,CONTAINER_NAME,APP_PORT

          script: |
            set -Eeuo pipefail

            echo "=========================================="
            echo "Starting EC2 deployment"
            echo "=========================================="

            echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"
            echo "Container: ${CONTAINER_NAME}"
            echo "Application port: ${APP_PORT}"

            # ------------------------------------------
            # Login to Docker Hub
            # ------------------------------------------

            echo "Logging into Docker Hub..."

            echo "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

            # ------------------------------------------
            # Store currently running image
            # ------------------------------------------

            OLD_IMAGE=""

            if docker ps \
              --filter "name=^/${CONTAINER_NAME}$" \
              --format "{{.Image}}" | grep -q .; then

              OLD_IMAGE=$(docker ps \
                --filter "name=^/${CONTAINER_NAME}$" \
                --format "{{.Image}}" | head -1)

              echo "Current image: ${OLD_IMAGE}"

            else
              echo "No existing container found."
            fi

            # ------------------------------------------
            # Pull new Docker image
            # ------------------------------------------

            echo "Pulling new Docker image..."

            docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

            # ------------------------------------------
            # Stop old container
            # ------------------------------------------

            echo "Stopping old container..."

            docker stop "${CONTAINER_NAME}" 2>/dev/null || true

            # ------------------------------------------
            # Remove old container
            # ------------------------------------------

            echo "Removing old container..."

            docker rm "${CONTAINER_NAME}" 2>/dev/null || true

            # ------------------------------------------
            # Start new container
            # ------------------------------------------

            echo "Starting new container..."

            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p "127.0.0.1:${APP_PORT}:${APP_PORT}" \
              "${IMAGE_NAME}:${IMAGE_TAG}"

            # ------------------------------------------
            # Health check
            # ------------------------------------------

            echo "Running application health check..."

            SUCCESS=false

            for i in {1..12}; do
              sleep 5

              if docker ps \
                --filter "name=^/${CONTAINER_NAME}$" \
                --filter "status=running" \
                --format "{{.Names}}" |
                grep -q "^${CONTAINER_NAME}$"; then

                if curl \
                  --fail \
                  --silent \
                  --show-error \
                  --max-time 5 \
                  "http://127.0.0.1:${APP_PORT}" > /dev/null; then

                  SUCCESS=true

                  echo "Application is healthy."

                  break
                fi
              fi

              echo "Health check attempt ${i}/12 failed."
            done

            # ------------------------------------------
            # Rollback on failure
            # ------------------------------------------

            if [ "$SUCCESS" != "true" ]; then

              echo "=========================================="
              echo "DEPLOYMENT FAILED"
              echo "=========================================="

              echo "Container logs:"

              docker logs "${CONTAINER_NAME}" || true

              if [ -n "$OLD_IMAGE" ]; then

                echo "=========================================="
                echo "Starting rollback"
                echo "Previous image: ${OLD_IMAGE}"
                echo "=========================================="

                docker stop "${CONTAINER_NAME}" 2>/dev/null || true

                docker rm "${CONTAINER_NAME}" 2>/dev/null || true

                docker run -d \
                  --name "${CONTAINER_NAME}" \
                  --restart unless-stopped \
                  -p "127.0.0.1:${APP_PORT}:${APP_PORT}" \
                  "${OLD_IMAGE}"

                sleep 5

                if docker ps \
                  --filter "name=^/${CONTAINER_NAME}$" \
                  --filter "status=running" \
                  --format "{{.Names}}" |
                  grep -q "^${CONTAINER_NAME}$"; then

                  echo "Rollback successful."

                else

                  echo "Rollback failed."

                  exit 1

                fi

              else

                echo "No previous image available for rollback."

              fi

              exit 1
            fi

            # ------------------------------------------
            # Deployment successful
            # ------------------------------------------

            echo "=========================================="
            echo "EC2 DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            echo "Running container:"

            docker ps \
              --filter "name=^/${CONTAINER_NAME}$"

            # ------------------------------------------
            # Cleanup old unused Docker images
            # ------------------------------------------

            echo "Cleaning unused Docker images..."

            docker image prune -af \
              --filter "until=72h" || true

            echo "=========================================="
            echo "Deployment completed successfully."
            echo "=========================================="
