name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  # ==================================================
  # AWS
  # ==================================================
  S3_REGION: ap-south-1
  SSM_REGION: ap-south-2
  S3_BUCKET: adx6sh-portfolio

  # ==================================================
  # Docker / EC2
  # ==================================================
  IMAGE_NAME: adx6sh/adx6sh-portfolio-repository
  CONTAINER_NAME: adx6sh-portfolio
  APP_PORT: 3000

  # ==================================================
  # Private EC2 instances
  # ==================================================
  PRIVATE_EC2_1: i-0c6fba2bb2b5cef4f
  PRIVATE_EC2_2: i-014c8ad0fc831917b

jobs:
  # ==================================================
  # CONTINUOUS INTEGRATION
  # ==================================================
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test --if-present

      - name: Build application
        run: npm run build

      - name: Verify static export
        run: |
          set -e

          if [ ! -d "out" ]; then
            echo "ERROR: out/ directory was not generated."
            exit 1
          fi

          echo "Static export generated successfully."
          du -sh out/

          echo "Generated files:"
          find out -maxdepth 2 -type f | head -50

      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-static-build
          path: out/
          if-no-files-found: error
          retention-days: 1

  # ==================================================
  # S3 DEPLOYMENT
  # ==================================================
  deploy-s3:
    name: Deploy to Amazon S3
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Next.js build
        uses: actions/download-artifact@v4
        with:
          name: nextjs-static-build
          path: out/

      - name: Verify build artifact
        run: |
          set -e

          if [ ! -d "out" ]; then
            echo "ERROR: out/ directory does not exist."
            exit 1
          fi

          echo "Build artifact verified."
          du -sh out/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.S3_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS credentials
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity

      - name: Deploy website to S3
        run: |
          set -e

          echo "=========================================="
          echo "Starting S3 deployment"
          echo "=========================================="

          echo "Bucket: s3://${S3_BUCKET}"
          echo "Region: ${S3_REGION}"

          aws s3 sync out/ \
            "s3://${S3_BUCKET}" \
            --region "${S3_REGION}" \
            --delete

      - name: Verify S3 deployment
        run: |
          echo "=========================================="
          echo "S3 DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          aws s3 ls \
            "s3://${S3_BUCKET}" \
            --region "${S3_REGION}" \
            --recursive | head -30

  # ==================================================
  # BUILD AND PUSH DOCKER IMAGE
  # ==================================================
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    needs: ci

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker image tag
        id: meta
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "Docker image"
          echo "=========================================="

          echo "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

          provenance: true
          sbom: true

  # ==================================================
  # PRIVATE EC2 DEPLOYMENT VIA SSM
  # ==================================================
  deploy-ec2:
    name: Deploy to Private EC2 via SSM
    runs-on: ubuntu-latest

    needs: docker

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # IMPORTANT:
    #
    # Do NOT add environment: production here.
    #
    # The IAM trust policy currently expects:
    #
    # repo:bettercalladx6sh/adx6sh:ref:refs/heads/main

    permissions:
      id-token: write
      contents: read

    steps:
      # ==================================================
      # TEMPORARY OIDC DEBUG
      # ==================================================
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;

            if (!requestUrl || !requestToken) {
              core.setFailed(
                "GitHub OIDC environment variables are not available."
              );
              return;
            }

            const response = await fetch(requestUrl, {
              headers: {
                Authorization: `bearer ${requestToken}`
              }
            });

            if (!response.ok) {
              core.setFailed(
                `Failed to request OIDC token: ${response.status} ${response.statusText}`
              );
              return;
            }

            const data = await response.json();
            const token = data.value;

            const payload = JSON.parse(
              Buffer.from(
                token.split(".")[1],
                "base64url"
              ).toString()
            );

            console.log("OIDC claims:");
            console.log("sub:", payload.sub);
            console.log("aud:", payload.aud);
            console.log("repository:", payload.repository);
            console.log("ref:", payload.ref);
            console.log(
              "environment:",
              payload.environment || "NONE"
            );

      # ==================================================
      # CONFIGURE AWS CREDENTIALS
      # ==================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_SSM_ROLE_ARN }}
          aws-region: ${{ env.SSM_REGION }}
          audience: sts.amazonaws.com

      # ==================================================
      # VERIFY AWS IDENTITY
      # ==================================================
      - name: Verify AWS identity
        run: |
          echo "=========================================="
          echo "AWS Identity"
          echo "=========================================="

          aws sts get-caller-identity

      # ==================================================
      # VERIFY SSM INSTANCES
      # ==================================================
      - name: Verify EC2 instances are online
        run: |
          set -e

          echo "=========================================="
          echo "Checking EC2 #1"
          echo "=========================================="

          aws ssm describe-instance-information \
            --region "${SSM_REGION}" \
            --filters "Key=InstanceIds,Values=${PRIVATE_EC2_1}"

          echo ""

          echo "=========================================="
          echo "Checking EC2 #2"
          echo "=========================================="

          aws ssm describe-instance-information \
            --region "${SSM_REGION}" \
            --filters "Key=InstanceIds,Values=${PRIVATE_EC2_2}"

      # ==================================================
      # DEPLOY EC2 #1
      # ==================================================
      - name: Deploy to Private EC2 #1
        run: |
          set -e

          echo "=========================================="
          echo "Deploying to EC2 #1"
          echo "Instance: ${PRIVATE_EC2_1}"
          echo "=========================================="

          DEPLOY_SCRIPT=$(cat <<EOF
          set -Eeuo pipefail

          echo "=========================================="
          echo "Starting EC2 #1 deployment"
          echo "=========================================="

          echo "Image:"
          echo "${IMAGE_NAME}:${{ needs.docker.outputs.image_tag }}"

          echo ""
          echo "Checking Docker..."

          docker --version

          echo ""
          echo "Pulling new image..."

          docker pull \
            "${IMAGE_NAME}:${{ needs.docker.outputs.image_tag }}"

          echo ""
          echo "Checking existing container..."

          OLD_IMAGE=""

          if docker ps \
            --filter "name=^/${CONTAINER_NAME}$" \
            --format "{{.Image}}" | grep -q .; then

            OLD_IMAGE=\$(docker ps \
              --filter "name=^/${CONTAINER_NAME}$" \
              --format "{{.Image}}" | head -1)

            echo "Current image: \${OLD_IMAGE}"

          else
            echo "No existing container found."
          fi

          echo ""
          echo "Stopping old container..."

          docker stop "${CONTAINER_NAME}" 2>/dev/null || true

          echo ""
          echo "Removing old container..."

          docker rm "${CONTAINER_NAME}" 2>/dev/null || true

          echo ""
          echo "Starting new container..."

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            -p "${APP_PORT}:${APP_PORT}" \
            "${IMAGE_NAME}:${{ needs.docker.outputs.image_tag }}"

          echo ""
          echo "Running health check..."

          SUCCESS=false

          for i in {1..12}; do

            sleep 5

            if docker ps \
              --filter "name=^/${CONTAINER_NAME}$" \
              --filter "status=running" \
              --format "{{.Names}}" |
              grep -q "^${CONTAINER_NAME}$"; then

              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                "http://127.0.0.1:${APP_PORT}" > /dev/null; then

                SUCCESS=true

                echo "Application is healthy."

                break
              fi
            fi

            echo "Health check attempt \${i}/12 failed."

          done

          if [ "\${SUCCESS}" != "true" ]; then

            echo "=========================================="
            echo "DEPLOYMENT FAILED"
            echo "=========================================="

            docker ps -a \
              --filter "name=^/${CONTAINER_NAME}$"

            echo ""
            echo "Container logs:"

            docker logs "${CONTAINER_NAME}" || true

            if [ -n "\${OLD_IMAGE}" ]; then

              echo ""
              echo "Starting rollback..."

              docker stop "${CONTAINER_NAME}" 2>/dev/null || true

              docker rm "${CONTAINER_NAME}" 2>/dev/null || true

              docker run -d \
                --name "${CONTAINER_NAME}" \
                --restart unless-stopped \
                -p "${APP_PORT}:${APP_PORT}" \
                "\${OLD_IMAGE}"

              sleep 5

              echo "Rollback completed."

            fi

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "EC2 #1 DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          docker ps \
            --filter "name=^/${CONTAINER_NAME}$"

          docker image prune -af \
            --filter "until=72h" || true

          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "${SSM_REGION}" \
            --instance-ids "${PRIVATE_EC2_1}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy portfolio ${GITHUB_SHA}" \
            --parameters "commands=${DEPLOY_SCRIPT}" \
            --timeout-seconds 1200 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo ""
          echo "Waiting for deployment..."

          aws ssm wait command-executed \
            --region "${SSM_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${PRIVATE_EC2_1}"

          echo ""
          echo "Deployment result:"

          aws ssm get-command-invocation \
            --region "${SSM_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${PRIVATE_EC2_1}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output yaml

          STATUS=$(aws ssm get-command-invocation \
            --region "${SSM_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${PRIVATE_EC2_1}" \
            --query "Status" \
            --output text)

          if [ "${STATUS}" != "Success" ]; then
            echo "EC2 #1 deployment failed."
            exit 1
          fi

      # ==================================================
      # DEPLOY EC2 #2
      # ==================================================
      - name: Deploy to Private EC2 #2
        run: |
          set -e

          echo "=========================================="
          echo "Deploying to EC2 #2"
          echo "Instance: ${PRIVATE_EC2_2}"
          echo "=========================================="

          DEPLOY_SCRIPT=$(cat <<EOF
          set -Eeuo pipefail

          echo "=========================================="
          echo "Starting EC2 #2 deployment"
          echo "=========================================="

          echo "Image:"
          echo "${IMAGE_NAME}:${{ needs.docker.outputs.image_tag }}"

          echo ""
          echo "Checking Docker..."

          docker --version

          echo ""
          echo "Pulling new image..."

          docker pull \
            "${IMAGE_NAME}:${{ needs.docker.outputs.image_tag }}"

          echo ""
          echo "Checking existing container..."

          OLD_IMAGE=""

          if docker ps \
            --filter "name=^/${CONTAINER_NAME}$" \
            --format "{{.Image}}" | grep -q .; then

            OLD_IMAGE=\$(docker ps \
              --filter "name=^/${CONTAINER_NAME}$" \
              --format "{{.Image}}" | head -1)

            echo "Current image: \${OLD_IMAGE}"

          else
            echo "No existing container found."
          fi

          echo ""
          echo "Stopping old container..."

          docker stop "${CONTAINER_NAME}" 2>/dev/null || true

          echo ""
          echo "Removing old container..."

          docker rm "${CONTAINER_NAME}" 2>/dev/null || true

          echo ""
          echo "Starting new container..."

          docker run -d \
            --name "${CONTAINER_NAME}" \
            --restart unless-stopped \
            -p "${APP_PORT}:${APP_PORT}" \
            "${IMAGE_NAME}:${{ needs.docker.outputs.image_tag }}"

          echo ""
          echo "Running health check..."

          SUCCESS=false

          for i in {1..12}; do

            sleep 5

            if docker ps \
              --filter "name=^/${CONTAINER_NAME}$" \
              --filter "status=running" \
              --format "{{.Names}}" |
              grep -q "^${CONTAINER_NAME}$"; then

              if curl \
                --fail \
                --silent \
                --show-error \
                --max-time 5 \
                "http://127.0.0.1:${APP_PORT}" > /dev/null; then

                SUCCESS=true

                echo "Application is healthy."

                break
              fi
            fi

            echo "Health check attempt \${i}/12 failed."

          done

          if [ "\${SUCCESS}" != "true" ]; then

            echo "=========================================="
            echo "DEPLOYMENT FAILED"
            echo "=========================================="

            docker ps -a \
              --filter "name=^/${CONTAINER_NAME}$"

            echo ""
            echo "Container logs:"

            docker logs "${CONTAINER_NAME}" || true

            if [ -n "\${OLD_IMAGE}" ]; then

              echo ""
              echo "Starting rollback..."

              docker stop "${CONTAINER_NAME}" 2>/dev/null || true

              docker rm "${CONTAINER_NAME}" 2>/dev/null || true

              docker run -d \
                --name "${CONTAINER_NAME}" \
                --restart unless-stopped \
                -p "${APP_PORT}:${APP_PORT}" \
                "\${OLD_IMAGE}"

              sleep 5

              echo "Rollback completed."

            fi

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "EC2 #2 DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          docker ps \
            --filter "name=^/${CONTAINER_NAME}$"

          docker image prune -af \
            --filter "until=72h" || true

          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "${SSM_REGION}" \
            --instance-ids "${PRIVATE_EC2_2}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy portfolio ${GITHUB_SHA}" \
            --parameters "commands=${DEPLOY_SCRIPT}" \
            --timeout-seconds 1200 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo ""
          echo "Waiting for deployment..."

          aws ssm wait command-executed \
            --region "${SSM_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${PRIVATE_EC2_2}"

          echo ""
          echo "Deployment result:"

          aws ssm get-command-invocation \
            --region "${SSM_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${PRIVATE_EC2_2}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output yaml

          STATUS=$(aws ssm get-command-invocation \
            --region "${SSM_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${PRIVATE_EC2_2}" \
            --query "Status" \
            --output text)

          if [ "${STATUS}" != "Success" ]; then
            echo "EC2 #2 deployment failed."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ALL DEPLOYMENTS SUCCESSFUL"
          echo "=========================================="
