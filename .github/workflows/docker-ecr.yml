name: Build and Push Docker Image to ECR

on:
  workflow_call:
    outputs:
      image_tag:
        description: Docker image tag
        value: ${{ jobs.docker.outputs.image_tag }}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-2
  ECR_REGISTRY: 207871833067.dkr.ecr.ap-south-2.amazonaws.com
  ECR_REPOSITORY: adx6sh-portfolio
  IMAGE_NAME: 207871833067.dkr.ecr.ap-south-2.amazonaws.com/adx6sh-portfolio

jobs:
  docker:
    name: Build & Push Docker → ECR
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.value')

          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "Failed to obtain OIDC token"
            exit 1
          fi

          PAYLOAD=$(echo "${TOKEN}" | cut -d '.' -f2)

          # Add padding required by base64
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "OIDC claims:"
          echo "${PAYLOAD}" | base64 -d 2>/dev/null | jq '{
            aud,
            sub,
            repository,
            repository_owner,
            ref
          }'

      - name: Debug GitHub OIDC subject
        id: oidc
        run: |
          set -euo pipefail

          TOKEN_RESPONSE=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "${TOKEN_RESPONSE}" | jq -r '.value')

          PAYLOAD=$(echo "${TOKEN}" | cut -d '.' -f2)

          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac

          echo "GitHub OIDC sub:"
          echo "${PAYLOAD}" | base64 -d 2>/dev/null | jq -r '.sub'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Docker image tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="sha-${GITHUB_SHA}"

          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Docker image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"
          echo "${IMAGE_NAME}:latest"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
