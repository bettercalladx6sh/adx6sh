name: Build and Push Docker Image to ECR

on:
  workflow_call:
    outputs:
      image_tag:
        description: Docker image tag
        value: ${{ jobs.docker.outputs.image_tag }}

env:
  ECR_REGISTRY: 207871833067.dkr.ecr.ap-south-2.amazonaws.com
  ECR_REPOSITORY: adx6sh-portfolio
  IMAGE_NAME: 207871833067.dkr.ecr.ap-south-2.amazonaws.com/adx6sh-portfolio

jobs:
  docker:
    name: Build & Push Docker → ECR
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Debug GitHub OIDC token
        uses: github/actions-oidc-debugger@main
        continue-on-error: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ap-south-2
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate Docker image tag
        id: meta
        shell: bash
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          echo "Image:"
          echo "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
